# 🔒 nginx.conf — Reverse proxy + HTTPS (self-signed)
# ทางเข้าหลักของระบบ: https://localhost
server {
    listen 80;
    server_name _;

    # บังคับทุก request ไป HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # เขียน log ลงไฟล์จริง (ไม่ใช้ symlink -> /dev/stdout ของ image มาตรฐาน)
    access_log /var/log/nginx/web-access.log main;
    error_log  /var/log/nginx/web-error.log warn;

    # Self-signed certificate (สร้างตอน build image)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # API -> container backend:3000
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend (Vue static) -> container frontend:80
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
