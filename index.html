<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>🌸 ระบบคิวโรงพยาบาล</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #ffe4ec 0%, #ffb6c1 50%, #ff91a4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 2.2rem 1.8rem;
            box-shadow: 0 12px 40px rgba(255, 105, 135, 0.25);
            max-width: 1150px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #d6336c;
            font-size: 2rem;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 4px rgba(214, 51, 108, 0.15);
        }
        .subtitle {
            color: #f06595;
            font-size: 0.9rem;
            margin-bottom: 1.3rem;
            letter-spacing: 0.5px;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            max-width: 640px;
            margin: 0 auto 1.2rem;
        }
        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 0.75rem 1rem;
            border: 2px solid #f8a5c2;
            border-radius: 1rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fff5f9;
            color: #862e4b;
        }
        input[type="text"]:focus {
            border-color: #d6336c;
            box-shadow: 0 0 0 4px rgba(214, 51, 108, 0.15);
        }
        button {
            padding: 0.7rem 1.4rem;
            background: linear-gradient(135deg, #f06595, #d6336c);
            color: #fff;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(214, 51, 108, 0.35);
        }
        button:active {
            transform: translateY(0);
        }

        /* ---------- กระดาน 3 คอลัมน์ตามสถานะ ---------- */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 0.4rem;
            text-align: left;
        }
        @media (max-width: 820px) {
            .board { grid-template-columns: 1fr; }
        }
        .col {
            background: rgba(255, 255, 255, 0.78);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 1.25rem;
            padding: 1rem 1.1rem;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .col h2 {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 1.05rem;
            margin-bottom: 0.9rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px dashed rgba(0, 0, 0, 0.07);
        }
        .col h2 .count {
            margin-left: auto;
            font-size: 0.78rem;
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            font-weight: 700;
        }
        .col-waiting h2 { color: #d6336c; }
        .col-checking h2 { color: #e8590c; }
        .col-done h2 { color: #2f9e44; }
        .col-waiting .count { background: #ffe3ec; color: #d6336c; }
        .col-checking .count { background: #fff3bf; color: #e8590c; }
        .col-done .count { background: #d3f9d8; color: #2b8a3e; }

        .list {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            min-height: 2.5rem;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #fff;
            border-radius: 0.9rem;
            padding: 0.55rem 0.8rem;
            box-shadow: 0 3px 12px rgba(214, 51, 108, 0.12);
            animation: fadeIn 0.3s ease;
        }
        .card .no {
            color: #c9b3bc;
            font-weight: 700;
            font-size: 0.78rem;
            flex-shrink: 0;
        }
        .card .name {
            flex: 1;
            min-width: 0;
            color: #862e4b;
            font-weight: 600;
            word-break: break-word;
            font-size: 0.95rem;
        }
        .card.waiting { border-left: 4px solid #d6336c; }
        .card.checking { border-left: 4px solid #f08c00; }
        .card.done { border-left: 4px solid #2f9e44; }
        .card.done .name { color: #2b8a3e; }
        .card.done .no { color: #8fd6a1; }

        .advance {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 0.8rem;
            flex-shrink: 0;
        }
        .card.waiting .advance { background: linear-gradient(135deg, #f06595, #d6336c); }
        .card.checking .advance { background: linear-gradient(135deg, #ffb347, #e8590c); box-shadow: 0 4px 14px rgba(232, 89, 12, 0.3); }

        .empty {
            color: #d9b4c0;
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.6rem 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: none; }
        }

        .actions {
            margin-top: 1.4rem;
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .clear-btn {
            background: transparent;
            color: #d6336c;
            border: 2px dashed #f8a5c2;
            font-size: 0.85rem;
            padding: 0.45rem 1rem;
            box-shadow: none;
        }
        .clear-btn:hover {
            background: #fff0f4;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 ระบบคิวโรงพยาบาล</h1>
        <p class="subtitle">โรงพยาบาลสีชมพู ✨</p>

        <div class="input-group">
            <input id="name" type="text" placeholder="กรุณากรอกชื่อผู้ป่วย...">
            <button onclick="add()">➕ เพิ่มคิว</button>
        </div>

        <div class="board">
            <section class="col col-waiting">
                <h2>🕐 รอตรวจ <span class="count" id="count-waiting">0</span></h2>
                <div class="list" id="list-waiting"></div>
            </section>
            <section class="col col-checking">
                <h2>🩺 กำลังตรวจ <span class="count" id="count-checking">0</span></h2>
                <div class="list" id="list-checking"></div>
            </section>
            <section class="col col-done">
                <h2>✅ ตรวจเสร็จ <span class="count" id="count-done">0</span></h2>
                <div class="list" id="list-done"></div>
            </section>
        </div>

        <div class="actions">
            <button class="clear-btn" onclick="clearWaiting()">🗑️ ล้างคิวที่รอตรวจ</button>
            <button class="clear-btn" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>
        </div>
    </div>

    <script>
        // ---------- เพิ่มคิวใหม่ (สถานะเริ่มต้น: รอตรวจ -> queue.txt) ----------
        async function add() {
            const name = document.getElementById("name").value.trim();
            if (!name) {
                alert("⚠️ กรุณากรอกชื่อก่อนเพิ่มคิว");
                return;
            }
            try {
                const res = await fetch("/api/queue", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name })
                });
                const data = await parseRes(res);
                if (!res.ok) {
                    alert("⚠️ " + (data.error || "บันทึกคิวไม่สำเร็จ"));
                    return;
                }
                document.getElementById("name").value = "";
                document.getElementById("name").focus();
                render(data);
            } catch (err) {
                alert("⚠️ เกิดข้อผิดพลาด: " + err.message);
            }
        }

        // ---------- เลื่อนสถานะ (waiting -> checking -> done) ----------
        async function advance(from, index) {
            try {
                const res = await fetch("/api/queue/move", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ from, index })
                });
                const data = await parseRes(res);
                if (!res.ok) {
                    alert("⚠️ " + (data.error || "เปลี่ยนสถานะไม่สำเร็จ"));
                    return;
                }
                render(data);
            } catch (err) {
                alert("⚠️ เกิดข้อผิดพลาด: " + err.message);
            }
        }

        // ---------- โหลดข้อมูลตอนเปิดหน้าเว็บ ----------
        async function loadQueue() {
            try {
                const res = await fetch("/api/queue");
                render(await res.json());
            } catch (err) {
                document.getElementById("list-waiting").innerHTML =
                    '<div class="empty">⚠️ โหลดข้อมูลไม่สำเร็จ<br>กรุณารัน "node server.js"</div>';
            }
        }

        // ---------- วาดกระดานทั้ง 3 สถานะ ----------
        function render(data) {
            renderList("waiting", data.waiting);
            renderList("checking", data.checking);
            renderList("done", data.done);
            document.getElementById("count-waiting").textContent = data.waiting.length;
            document.getElementById("count-checking").textContent = data.checking.length;
            document.getElementById("count-done").textContent = data.done.length;
        }

        function renderList(status, names) {
            const list = document.getElementById("list-" + status);
            list.innerHTML = "";
            if (!names.length) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "— ว่าง —";
                list.appendChild(empty);
                return;
            }
            names.forEach((name, i) => {
                const card = document.createElement("div");
                card.className = "card " + status;

                const no = document.createElement("span");
                no.className = "no";
                no.textContent = "#" + (i + 1);

                const nameEl = document.createElement("span");
                nameEl.className = "name";
                nameEl.textContent = name;

                card.appendChild(no);
                card.appendChild(nameEl);

                if (status === "waiting" || status === "checking") {
                    const btn = document.createElement("button");
                    btn.className = "advance";
                    btn.textContent = status === "waiting" ? "เริ่มตรวจ ▶" : "✓ ตรวจเสร็จ";
                    btn.addEventListener("click", () => advance(status, i));
                    card.appendChild(btn);
                }
                list.appendChild(card);
            });
        }

        // ---------- ล้างคิวที่รอตรวจ (เฉพาะ queue.txt) ----------
        async function clearWaiting() {
            if (!confirm("🗑️ ยืนยันล้างคิวที่ยังรอตรวจทั้งหมด?")) return;
            await callClear("/api/queue/clear", "ล้างคิวไม่สำเร็จ");
        }

        // ---------- ล้างข้อมูลทุกสถานะ ----------
        async function clearAll() {
            if (!confirm("🧹 จะล้างข้อมูลทุกสถานะ (รอตรวจ / กำลังตรวจ / ตรวจเสร็จ) ทั้งหมด?")) return;
            await callClear("/api/queue/clear-all", "ล้างข้อมูลไม่สำเร็จ");
        }

        async function callClear(url, failMsg) {
            try {
                const res = await fetch(url, { method: "POST" });
                const data = await parseRes(res);
                if (!res.ok) {
                    alert("⚠️ " + (data.error || failMsg));
                    return;
                }
                render(data);
                document.getElementById("name").focus();
            } catch (err) {
                alert("⚠️ เกิดข้อผิดพลาด: " + err.message);
            }
        }

        // แปลง response เป็น JSON (แต่ถ้าไม่ใช่ JSON ก็คืน error text กลับไป)
        async function parseRes(res) {
            const text = await res.text();
            try { return JSON.parse(text); } catch { return { error: text }; }
        }

        // กด Enter ในช่องชื่อ = เพิ่มคิว
        document.getElementById("name").addEventListener("keydown", (e) => {
            if (e.key === "Enter") add();
        });

        // โหลดข้อมูลจากไฟล์เมื่อเปิดหน้าเว็บ
        loadQueue();
    </script>
</body>
</html>
