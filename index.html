<!DOCTYPE html>
<html>
<head><title>คิว</title></head>
<body>
<h1>คิว</h1>
<input id="name" placeholder="ชื่อ">
<button onclick="add()">เพิ่ม</button>
<div id="queue"></div>
<script>
function add() {
    let name = document.getElementById("name").value;
    if (!name) return;
    document.getElementById("queue").innerHTML += `<p>${name}</p>`;
    document.getElementById("name").value = "";
}
</script>
</body>
</html>
