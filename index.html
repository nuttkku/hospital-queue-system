<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>🌸 ระบบคิวโรงพยาบาล</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #ffe4ec 0%, #ffb6c1 50%, #ff91a4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 12px 40px rgba(255, 105, 135, 0.25);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            color: #d6336c;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(214, 51, 108, 0.15);
        }
        .subtitle {
            color: #f06595;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #f8a5c2;
            border-radius: 1rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fff5f9;
        }
        input[type="text"]:focus {
            border-color: #d6336c;
            box-shadow: 0 0 0 4px rgba(214, 51, 108, 0.15);
        }
        button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #f06595, #d6336c);
            color: #fff;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(214, 51, 108, 0.35);
        }
        button:active {
            transform: translateY(0);
        }
        .clear-btn {
            background: transparent;
            color: #d6336c;
            border: 2px dashed #f8a5c2;
            font-size: 0.8rem;
            padding: 0.4rem 0.9rem;
            margin-top: 1rem;
            box-shadow: none;
        }
        .clear-btn:hover {
            background: #fff0f4;
            transform: none;
            box-shadow: none;
        }
        #queue {
            margin-top: 1rem;
            text-align: left;
        }
        #queue p {
            background: #fff5f9;
            border-left: 4px solid #d6336c;
            padding: 0.65rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            color: #862e4b;
            font-size: 1rem;
            animation: fadeIn 0.3s ease;
        }
        #queue p::before {
            content: "🩺 ";
        }
        .empty-msg {
            color: #f06595;
            font-style: italic;
            text-align: center;
            padding: 1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .counter {
            color: #d6336c;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 ระบบคิว</h1>
        <p class="subtitle">โรงพยาบาลสีชมพู ✨</p>

        <div class="input-group">
            <input id="name" type="text" placeholder="กรุณากรอกชื่อผู้ป่วย...">
            <button onclick="add()">➕ เพิ่มคิว</button>
        </div>

        <div id="queue">
            <p class="empty-msg">— ยังไม่มีคิว —</p>
        </div>
        <div class="counter" id="counter">👤 จำนวนในคิว: 0</div>
        <button class="clear-btn" onclick="clearQueue()">🗑️ ล้างคิวทั้งหมด</button>
    </div>

    <script>
        // ---- เพิ่มคิว: ส่งชื่อไปให้เซิร์ฟเวอร์บันทึกลงไฟล์ queue.txt ----
        async function add() {
            const name = document.getElementById("name").value.trim();
            if (!name) {
                alert("⚠️ กรุณากรอกชื่อก่อนเพิ่มคิว");
                return;
            }
            try {
                const res = await fetch("/api/queue", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name })
                });
                const data = await parseRes(res);
                if (!res.ok) {
                    alert("⚠️ " + (data.error || "บันทึกคิวไม่สำเร็จ"));
                    return;
                }
                document.getElementById("name").value = "";
                document.getElementById("name").focus();
                renderQueue(data.queue);
            } catch (err) {
                alert("⚠️ เกิดข้อผิดพลาด: " + err.message);
            }
        }

        // ---- โหลดคิวเดิมจากไฟล์ queue.txt ตอนเปิดหน้าเว็บ ----
        async function loadQueue() {
            try {
                const res = await fetch("/api/queue");
                const queue = await res.json();
                renderQueue(queue);
            } catch (err) {
                document.getElementById("queue").innerHTML =
                    '<p class="empty-msg">⚠️ ไม่สามารถโหลดคิวจากเซิร์ฟเวอร์ได้<br>กรุณารันด้วย "node server.js"</p>';
            }
        }

        function renderQueue(queue) {
            const container = document.getElementById("queue");
            container.innerHTML = "";
            if (!queue.length) {
                container.innerHTML = '<p class="empty-msg">— ยังไม่มีคิว —</p>';
            } else {
                queue.forEach((name, i) => {
                    const p = document.createElement("p");
                    p.textContent = `คิวที่ ${i + 1}: ${name}`;
                    container.appendChild(p);
                });
            }
            updateCounter();
        }

        // แปลง response เป็น JSON แต่ถ้าไม่ใช่ JSON ก็คืน error text กลับไป
        async function parseRes(res) {
            const text = await res.text();
            try { return JSON.parse(text); } catch { return { error: text }; }
        }

        // ---- ล้างคิวทั้งหมด (ลบข้อมูลในไฟล์ queue.txt ด้วย) ----
        async function clearQueue() {
            if (!confirm("🗑️ ยืนยันล้างคิวทั้งหมดใช่หรือไม่?")) return;
            try {
                const res = await fetch("/api/queue/clear", { method: "POST" });
                const data = await parseRes(res);
                if (!res.ok) {
                    alert("⚠️ " + (data.error || "ล้างคิวไม่สำเร็จ"));
                    return;
                }
                renderQueue(data.queue);
                document.getElementById("name").focus();
            } catch (err) {
                alert("⚠️ เกิดข้อผิดพลาด: " + err.message);
            }
        }

        function updateCounter() {
            const items = document.querySelectorAll("#queue p:not(.empty-msg)");
            document.getElementById("counter").textContent =
                `👤 จำนวนในคิว: ${items.length}`;
        }

        // กด Enter ในช่องชื่อ = เพิ่มคิว
        document.getElementById("name").addEventListener("keydown", (e) => {
            if (e.key === "Enter") add();
        });

        // โหลดคิวเดิมจากไฟล์เมื่อเปิดหน้าเว็บ
        loadQueue();
    </script>
</body>
</html>
